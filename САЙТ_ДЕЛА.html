<meta charset="utf-8">
<title>Древо дела А-Банка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Дело № 127/20805/26 как 3D-спираль: каждый участок и узел открывает меню — суть, документы, что делать, сроки, цифры, риски.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одноэкранное приложение — тонкая полоса с номером дела и статусом, под ней на весь экран 3D-спираль дела с участками; меню участка или узла — карточка справа (компьютер) или нижний лист (телефон) */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#141D33; --ink-2:#46526D; --ink-3:#5E6985;
  --rule:#CDD4E0; --rule-2:#E3E8F0; --stamp:#4436C9; --stamp-soft:#E7E4FB;
  --fact:#0B7F62; --issue:#B06A08; --issue-ink:#8F5404; --unknown:#6E7A93; --client:#A23B8C;
  --future:#2F6FB3; --goal:#B98A0A; --risk:#C0392B;
  --c1:#2F6FB3; --c2:#B8740A; --c3:#8E44AD;
  --scene:#E9EDF4; --scene-2:#D8DFEA;
  --shadow:0 22px 60px -26px rgba(20,29,51,.45);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --peek:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1120; --sheet:#141B2D; --ink:#E6EBF4; --ink-2:#A9B3CA; --ink-3:#8590AA;
    --rule:#2A3550; --rule-2:#1E2740; --stamp:#A097FF; --stamp-soft:#272352;
    --fact:#3BC79E; --issue:#EFA53D; --issue-ink:#EFA53D; --unknown:#8D99B2; --client:#E27FCB;
    --future:#6FA8F0; --goal:#F2C94C; --risk:#F2735F;
    --c1:#5C95DE; --c2:#C98019; --c3:#AE74D6;
    --scene:#0A0F1C; --scene-2:#111A2E;
    --shadow:0 24px 70px -24px rgba(0,0,0,.78);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1120; --sheet:#141B2D; --ink:#E6EBF4; --ink-2:#A9B3CA; --ink-3:#8590AA;
  --rule:#2A3550; --rule-2:#1E2740; --stamp:#A097FF; --stamp-soft:#272352;
  --fact:#3BC79E; --issue:#EFA53D; --issue-ink:#EFA53D; --unknown:#8D99B2; --client:#E27FCB;
  --future:#6FA8F0; --goal:#F2C94C; --risk:#F2735F;
  --c1:#5C95DE; --c2:#C98019; --c3:#AE74D6;
  --scene:#0A0F1C; --scene-2:#111A2E;
  --shadow:0 24px 70px -24px rgba(0,0,0,.78);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
a{color:var(--stamp);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
h2,h3,h4{text-wrap:balance}
.mono{font-family:var(--f-mono)}
.n{white-space:nowrap;font-variant-numeric:tabular-nums}
code{font:500 12.5px/1.4 var(--f-mono);padding:1px 5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.kicker{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* полоса */
.bar{flex:none;position:relative;z-index:30;display:flex;align-items:center;gap:6px 18px;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-case{appearance:none;border:0;background:none;padding:4px 0;margin:0;cursor:pointer;display:inline-flex;align-items:baseline;gap:8px;font:500 15px/1.1 var(--f-display);color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.bar-case .k{font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.bar-st{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;font:500 12px/1.4 var(--f-mono);color:var(--ink-2);min-width:0}
.bar-st span{white-space:nowrap}
.bar-st span:not(:last-child)::after{content:"·";margin:0 8px;color:var(--ink-3)}
.bar-st .hl{color:var(--client)}
.bar-st .nx{color:var(--ink);font-weight:500}
.bar-nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.bb{appearance:none;border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 12px;margin:0;font:500 13px/1.1 var(--f-body);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.bb:hover{background:var(--stamp-soft);color:var(--ink)}
.bb.pri{border-color:var(--stamp);color:var(--ink);background:var(--sheet)}
.bb.pri[aria-expanded="true"]{background:var(--stamp-soft)}
@media (max-width:1180px){.bb.ent{display:none}}
@media (max-width:760px){
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:7px}
  .bar-case{font-size:14px}
  .bar-st{grid-column:1/-1;grid-row:2;font-size:10.5px;letter-spacing:-.01em}
  .bar-st span:not(:last-child)::after{margin:0 5px}
  .bar-nav{grid-column:2;grid-row:1}
}

/* сцена */
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--scene)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
#scene:focus-visible{box-shadow:inset 0 0 0 2px var(--stamp)}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.nl,.zl{position:absolute;left:0;top:0;pointer-events:auto;margin:0;cursor:pointer;white-space:nowrap;visibility:hidden;will-change:transform;text-align:left;appearance:none}
.nl{display:flex;flex-direction:column;align-items:flex-start;padding:3px 8px 4px;border:1px solid transparent;border-radius:7px;background:var(--sheet);background:color-mix(in srgb,var(--sheet) 86%,transparent);color:var(--ink);font:500 12.5px/1.25 var(--f-body)}
.nl .d{font:400 10.5px/1.3 var(--f-mono);color:var(--ink-3)}
.nl:hover,.nl.hov{border-color:var(--rule)}
.nl.sel{border-color:var(--stamp);box-shadow:0 0 0 1px var(--stamp)}
.nl.now .t{font-weight:600}
.zl{display:flex;flex-direction:column;padding:4px 10px 5px 9px;border:1px solid var(--rule);border-left:3px solid var(--zc);border-radius:4px 9px 9px 4px;background:var(--sheet);background:color-mix(in srgb,var(--sheet) 90%,transparent);color:var(--ink);font:600 12.5px/1.25 var(--f-body)}
.zl em{font:500 10.5px/1 var(--f-mono);font-style:normal;color:var(--ink-3);margin-left:7px}
.zl .s{font:400 11.5px/1.3 var(--f-body);color:var(--ink-2)}
.zl:hover,.zl.hov{border-color:var(--zc)}
.zl.sel{box-shadow:0 0 0 2px var(--zc)}
.ab{display:inline-grid;place-items:center;min-width:17px;height:17px;margin-left:6px;padding:0 4px;border-radius:9px;background:var(--sc);color:var(--sheet);font:600 10px/1 var(--f-mono);vertical-align:1px}
.stage-ui{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.seg{display:inline-flex;pointer-events:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;overflow:hidden;box-shadow:0 6px 18px -12px rgba(20,29,51,.5)}
.seg button{appearance:none;border:0;margin:0;background:transparent;cursor:pointer;padding:7px 11px;font:500 12.5px/1.2 var(--f-body);color:var(--ink-2);min-width:34px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--stamp-soft);color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--stamp);outline-offset:-2px}
.hint{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;font:400 11.5px/1.3 var(--f-mono);color:var(--ink-3);pointer-events:none}
.nogl{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:64px;margin:0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-size:14px;max-width:520px}
.sab{position:absolute;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
@media (max-width:760px){.hint{display:none}.seg button{padding:7px 9px}}

/* меню */
.menu{position:absolute;z-index:20;top:12px;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s}
.menu.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.m-peek{display:none}
.m-in{display:flex;flex-direction:column;flex:1;min-height:0}
.m-head{padding:14px 16px 10px 18px;border-bottom:1px solid var(--rule-2)}
.m-top{display:flex;align-items:center;gap:8px}
.zchip{appearance:none;display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:calc(100% - 46px);border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 11px 5px 9px;margin:0;font:500 12px/1.2 var(--f-body);color:var(--ink-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
span.zchip{cursor:default}
button.zchip:hover{border-color:var(--zc);color:var(--ink)}
.zchip i,.zsq{width:9px;height:9px;border-radius:2px;background:var(--zc);flex:none;display:inline-block}
.m-x{margin-left:auto;appearance:none;flex:none;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;font:400 20px/1 var(--f-body);color:var(--ink-2);display:grid;place-items:center}
.m-x:hover{border-color:var(--ink-3);color:var(--ink)}
.m-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.m-date{font:500 12.5px/1 var(--f-mono);color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 7px;border:1px solid var(--rule);border-radius:999px;font:500 11.5px/1.3 var(--f-body);color:var(--ink)}
.m-title{font:500 20px/1.22 var(--f-display);margin:10px 0 2px;letter-spacing:-.01em;outline:none}
.m-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:9px 14px;border-bottom:1px solid var(--rule-2)}
.m-tabs [role="tab"]{appearance:none;border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 11px;margin:0;font:500 13px/1.1 var(--f-body);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.m-tabs [role="tab"]:hover{color:var(--ink);background:var(--paper)}
.m-tabs [role="tab"][aria-selected="true"]{background:var(--stamp-soft);color:var(--ink);border-color:var(--stamp)}
.m-tabs .cnt{font:500 10.5px/1 var(--f-mono);color:var(--ink-3);margin-left:6px}
.m-body{flex:1;min-height:0;overflow:auto;padding:16px 18px 22px;overscroll-behavior:contain;font-size:14.5px;line-height:1.55}
.m-body:focus-visible{outline-offset:-3px}
.m-nav{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--rule-2)}
.btn{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:500 13px/1.2 var(--f-body);padding:9px 12px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:default}
.nv{flex:1 1 0;min-width:0;display:grid;gap:2px;text-align:left}
.nv.nx{text-align:right}
.nv .k{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nv .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){
  .menu{top:auto;left:0;right:0;bottom:0;width:auto;height:min(74%,680px);border-radius:16px 16px 0 0;border-width:1px 0 0;visibility:visible;transform:translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom,0px)));transition:transform .34s cubic-bezier(.2,.8,.2,1)}
  .menu.open{transform:none;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
  .m-peek{appearance:none;display:flex;align-items:center;gap:9px;flex:none;width:100%;height:var(--peek);margin:0;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--rule-2);background:transparent;color:var(--ink);cursor:pointer;text-align:left;position:relative}
  .m-peek::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--rule)}
  .m-peek:focus-visible{outline-offset:-3px}
  .m-peek .pd{font:500 11px/1 var(--f-mono);color:var(--ink-3);flex:none}
  .m-peek .pt{font:600 14.5px/1.2 var(--f-body);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-peek .pc{font:500 12.5px/1 var(--f-body);color:var(--stamp);flex:none}
  .m-peek .pk{display:flex;align-items:center;gap:9px;width:100%;min-width:0}
  .m-peek .pk-o{justify-content:flex-end}
  .menu.open .m-peek .pk-c,.menu:not(.open) .m-peek .pk-o{display:none}
  .menu.open .m-peek{height:34px;padding-top:12px;padding-bottom:2px;border-bottom:0}
  .m-in{padding-bottom:env(safe-area-inset-bottom,0px)}
  .m-head{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .m-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .m-top,.m-meta{display:contents}
  .m-head .m-x{display:none}
  .m-title{font-size:18px;margin:2px 0 0;flex:1 0 100%}
  .m-tabs{gap:2px;padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px))}
  .m-tabs [role="tab"]{padding:6px 9px;font-size:12.5px}
  .m-body{padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
  .m-nav{padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
}

/* содержимое меню */
.m-body>*:first-child{margin-top:0}
.m-body p{margin:0 0 10px}
.m-body .lead{font-size:15.5px;line-height:1.5}
.next{margin:4px 0 12px;padding:12px 14px;border:1px solid var(--rule);border-left:3px solid var(--client);border-radius:4px 10px 10px 4px;background:var(--paper)}
.next p{margin:5px 0 10px}
.nx-btns{display:flex;flex-wrap:wrap;gap:6px}
.btn.sm{padding:7px 10px;font-size:12.5px}
.note{color:var(--ink-2);font-size:13.5px}
.m-body p.note{margin-top:8px}
.sub{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 9px}
.grp{margin:0}
.grp+.grp{margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule)}
.gh{margin:0 0 4px}
.gh button,.lnk{appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;font:600 14.5px/1.35 var(--f-body);color:var(--ink);text-align:left}
.gh button:hover,.lnk:hover{color:var(--stamp)}
.grp>.sub{margin-top:12px}
ul.plain,ul.steps,ul.risks,ul.files{margin:0 0 10px;padding-left:18px;display:grid;gap:6px}
ul.risks li::marker{color:var(--risk)}
ul.steps li::marker{color:var(--stamp)}
.g{--gc:var(--ink-3);width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;background:var(--gc);border:2px solid var(--gc)}
.g[data-s="fact"]{--gc:var(--fact)}
.g[data-s="issue"]{--gc:var(--issue);box-shadow:0 0 0 2px var(--sheet),0 0 0 3px var(--issue)}
.g[data-s="unknown"]{--gc:var(--unknown);background:transparent}
.g[data-s="client"]{--gc:var(--client);background:transparent;border-style:dashed}
.g[data-s="possible"]{--gc:var(--unknown);background:transparent;border-style:dotted}
.g[data-s="now"]{--gc:var(--stamp);box-shadow:0 0 0 3px var(--stamp-soft)}
.g[data-s="future"]{--gc:var(--future);background:transparent}
.g[data-s="goal"]{--gc:var(--goal)}
.g[data-s="risk"]{--gc:var(--risk);border-radius:2px;transform:rotate(45deg) scale(.82)}
.g[data-s="entry"]{--gc:var(--ink-2);border-radius:3px;background:transparent}
.zlist{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule-2)}
.zlist li{border-bottom:1px solid var(--rule-2)}
.zlist button{appearance:none;width:100%;margin:0;border:0;background:none;padding:10px 6px;display:grid;grid-template-columns:14px minmax(0,1fr);gap:1px 10px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border-radius:8px}
.zlist button:hover{background:var(--stamp-soft)}
.zlist .g{grid-row:1/span 3;margin-top:4px}
.zlist .zd{font:500 11.5px/1.3 var(--f-mono);color:var(--ink-3)}
.zlist b{font-weight:600;font-size:14.5px;line-height:1.35}
.zlist .zx{font-size:13px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* чек-лист */
.prog{font-size:13.5px;color:var(--ink-2)}
.todo{list-style:none;margin:0 0 10px;padding:0;border-top:1px solid var(--rule)}
.todo li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.todo input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--stamp)}
.todo label{font-weight:600;cursor:pointer;font-size:14.5px;line-height:1.4}
.todo .no{font:500 12px/1 var(--f-mono);color:var(--ink-3);margin-right:8px}
.todo .td{color:var(--ink-2);font-size:13.5px;line-height:1.5;margin-top:3px}
.todo .tag{grid-column:2;justify-self:start}
.todo li.done label{text-decoration:line-through;color:var(--ink-3)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);padding:5px 7px;border-radius:4px;white-space:nowrap}
.tag[data-k="you"]{border-color:var(--stamp);color:var(--ink)}

/* сроки */
.dl{list-style:none;margin:0 0 10px;padding:0;position:relative}
.dl::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:2px;background:var(--rule)}
.dl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:8px 0;position:relative}
.dl .dot{--gc:var(--ink-3);width:14px;height:14px;border-radius:50%;margin-top:3px;background:var(--gc);box-shadow:0 0 0 4px var(--sheet);position:relative;z-index:1}
.dl li[data-s="fact"] .dot{--gc:var(--fact)}
.dl li[data-s="issue"] .dot{--gc:var(--issue)}
.dl li[data-s="unknown"] .dot{--gc:var(--unknown)}
.dl li[data-s="client"] .dot{--gc:var(--client)}
.dl li[data-s="future"] .dot{--gc:var(--future)}
.dl li[data-s="goal"] .dot{--gc:var(--goal)}
.dl .when{font:500 12.5px/1.4 var(--f-mono);color:var(--ink)}
.dl .dt{font-weight:600;font-size:14.5px;line-height:1.35}

  var c=[0,0,0],ns=z.nodes.map(function(id){return byId[id];});ns.forEach(function(n){c[0]+=n.pos[0]/ns.length;c[1]+=n.pos[1]/ns.length;c[2]+=n.pos[2]/ns.length;});
  var rho=0;ns.forEach(function(n){rho=Math.max(rho,Math.hypot(n.pos[0]-c[0],n.pos[1]-c[1],n.pos[2]-c[2]));});
  var d={tx:c[0],ty:c[1],tz:c[2],dist:clamp(rho*2.3+11+(mobile?6:0),15,44),pitch:.2},rr=Math.hypot(c[0],c[2]);if(rr>1)d.yaw=frontYaw(Math.atan2(c[2],c[0]));goTo(d,1100);lastInteract=performance.now();}
function zoom(k){goTo({dist:clamp(cam.dist*k,9,95)},320);lastInteract=performance.now();}
function setPressed(name){$$('#stage-ui [data-view]').forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-view')===name));});}
function view(name){
  if(name==='all')goTo({tx:0,ty:1,tz:0,dist:fitAll(),pitch:.2},1100);
  else if(name==='now'){var n=byId.now;selectNode(n,{fly:false});goTo({tx:n.pos[0],ty:n.pos[1],tz:n.pos[2],dist:mobile&&menuOpen?20:15,pitch:.16,yaw:frontYaw(n.cy[0])},1000);}
  else if(name==='next'){var fr=freeRect();goTo({tx:0,ty:9.4,tz:0,dist:clamp(17*F/Math.max(150,fr.h-60),18,70),pitch:.24},1100);}
  setPressed(name);lastInteract=performance.now();}

/* ---------- меню ---------- */
var TABS=[['sut','Суть'],['docs','Документы'],['todo','Что делать'],['dl','Сроки'],['num','Цифры'],['risk','Риски'],['aud','Аудит']];
function buildView(){if(cur.kind==='zone'){var z=ZBY[cur.id];return {T:zoneView(z),z:z,title:z.name+' — '+z.sub,date:z.dates||'',s:null,isZone:true};}var n=byId[cur.id];return {T:nodeView(n),z:ZBY[n.z],title:n.title,date:n.date,s:n.s};}
function renderMenu(){VIEW=buildView();renderHead();renderTabs();renderBody();renderNav();renderPeek();}
function renderHead(){var v=VIEW,z=v.z,h='<div class="m-top">';
  if(v.isZone)h+='<span class="zchip" style="--zc:var('+z.tok+')"><i></i>Участок спирали · '+plural(z.nodes.length,'узел','узла','узлов')+'</span>';
  else if(z&&z.single)h+='<span class="zchip" style="--zc:var('+z.tok+')"><i></i>'+esc(z.name+' — '+z.sub)+'</span>';
  else if(z)h+='<button type="button" class="zchip" data-zone="'+z.id+'" style="--zc:var('+z.tok+')" title="Открыть участок целиком"><i></i>'+esc(z.name+' — '+z.sub)+'</button>';
  h+='<button type="button" class="m-x" aria-label="Закрыть меню">×</button></div>';
  h+='<div class="m-meta"><span class="m-date">'+esc(v.date)+'</span>'+(v.s?chipS(v.s):'')+'</div>';
  h+='<h2 class="m-title" id="m-title" tabindex="-1">'+esc(v.title)+'</h2>';
  mHead.innerHTML=h;}
function availTabs(){return TABS.filter(function(t){var x=VIEW.T[t[0]];return x&&x.length;});}
function tabCount(k){var h=VIEW.T[k]||'';if(k==='docs')return (h.match(/<a /g)||[]).length;if(k==='aud')return (h.match(/<li /g)||[]).length;return 0;}
function renderTabs(){var av=availTabs();if(!av.some(function(t){return t[0]===curTab;}))curTab='sut';
  mTabs.innerHTML=av.map(function(t){var on=t[0]===curTab,c=tabCount(t[0]);return '<button type="button" role="tab" id="tab-'+t[0]+'" data-tab="'+t[0]+'" aria-selected="'+on+'" aria-controls="m-body" tabindex="'+(on?0:-1)+'">'+esc(t[1])+(c?'<span class="cnt">'+c+'</span>':'')+'</button>';}).join('');}
function renderBody(){mBody.innerHTML=VIEW.T[curTab]||'';mBody.setAttribute('aria-labelledby','tab-'+curTab);mBody.scrollTop=0;tip.hidden=true;}
function nbrs(){if(cur.kind==='node'){var i=ORDER.indexOf(cur.id);return [i>0?['node',ORDER[i-1]]:null,i<ORDER.length-1?['node',ORDER[i+1]]:null];}var j=ZONES.indexOf(ZBY[cur.id]);return [j>0?['zone',ZONES[j-1].id]:null,j<ZONES.length-1?['zone',ZONES[j+1].id]:null];}
function nbrTitle(x){if(x[0]==='node')return byId[x[1]].title;var z=ZBY[x[1]];return z.name+' — '+z.sub;}
function renderNav(){var nn=nbrs();mNav.innerHTML=[[0,'← Раньше',-1],[1,'Дальше →',1]].map(function(o){var x=nn[o[0]];return '<button type="button" class="btn nv'+(o[0]?' nx':'')+'" data-go="'+o[2]+'"'+(x?'':' disabled')+'><span class="k">'+o[1]+'</span><span class="nt">'+(x?esc(nbrTitle(x)):'—')+'</span></button>';}).join('');}
function renderPeek(){if(!VIEW)return;peekEl.innerHTML='<span class="pk pk-c">'+(VIEW.s?'<i class="g" data-s="'+VIEW.s+'"></i>':'<i class="zsq" style="--zc:var('+VIEW.z.tok+')"></i>')+'<span class="pd">'+esc(VIEW.date)+'</span><span class="pt">'+esc(VIEW.title)+'</span><span class="pc">Открыть</span></span><span class="pk pk-o"><span class="pc">Свернуть</span></span>';}
function setTab(k,focus){curTab=k;VIEW=buildView();renderTabs();renderBody();if(focus){var b=$('#tab-'+k);if(b)try{b.focus();}catch(_){}}}
function setMenu(open){menuOpen=!!open;menu.classList.toggle('open',menuOpen);peekEl.setAttribute('aria-expanded',String(menuOpen));renderPeek();try{mIn.inert=mobile&&!menuOpen;}catch(_){}updateCenter();dirty=true;}
function closeMenu(){var inside=menu.contains(document.activeElement);setMenu(false);if(inside){try{(mobile?peekEl:cv).focus({preventScroll:true});}catch(_){}}}
function focusTitle(){var mt=$('#m-title');if(mt)try{mt.focus({preventScroll:true});}catch(_){}}
function setHash(id){try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}catch(_){}}
function selectNode(n,o){if(!n)return;o=o||{};cur={kind:'node',id:n.id};if(o.open)setMenu(true);renderMenu();dirty=true;
  if(o.fly!==false&&ctx)flyNode(n);if(o.hash!==false)setHash(n.id);srEl.textContent='Открыто: '+n.title;if(o.focus)focusTitle();setPressed('');}
function selectZone(z,o){if(!z)return;if(z.single)return selectNode(byId[z.nodes[0]],o);o=o||{};cur={kind:'zone',id:z.id};if(o.open)setMenu(true);renderMenu();dirty=true;
  if(o.fly!==false&&ctx)flyZone(z);if(o.hash!==false)setHash(z.id);srEl.textContent='Открыт участок: '+z.name;if(o.focus)focusTitle();setPressed('');}
function go(d){var x=nbrs()[d>0?1:0];if(!x)return;if(x[0]==='node')selectNode(byId[x[1]],{open:true});else selectZone(ZBY[x[1]],{open:true});}
function filterReg(w){regWho=w;$$('.filt button',mBody).forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-who')===w));});$$('.reg li[data-who]',mBody).forEach(function(r){r.hidden=!(w==='all'||r.getAttribute('data-who')===w);});}
function copyVis(btn){var el=$('#vispath');if(!el)return;var txt=el.textContent;function sel(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){btn.textContent='Скопировано';},function(){sel();btn.textContent='Выделено — нажмите Ctrl+C';});}else{sel();btn.textContent='Выделено — нажмите Ctrl+C';}}
function saveTodo(cb){done[cb.id]=cb.checked;var l=cb.closest('li');if(l)l.classList.toggle('done',cb.checked);try{localStorage.setItem(TKEY,JSON.stringify(done));}catch(_){}var p=$('#todo-prog');if(p)p.textContent=progText();}
function showTip(text,x,y){tip.textContent=nb(text);tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=clamp(x+12,8,window.innerWidth-w-8)+'px';tip.style.top=clamp(y-h-10,8,window.innerHeight-h-8)+'px';}

menu.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!menu.contains(b))return;
  if(b===peekEl){setMenu(!menuOpen);if(menuOpen)dirty=true;return;}
  if(b.classList.contains('m-x')){closeMenu();return;}
  var k=b.getAttribute('data-tab')||b.getAttribute('data-tabgo');if(k){setTab(k,true);return;}
  var g=b.getAttribute('data-go');if(g){go(+g);return;}
  var nid=b.getAttribute('data-node');if(nid&&byId[nid]){selectNode(byId[nid],{open:true});return;}
  var zid=b.getAttribute('data-zone');if(zid&&ZBY[zid]){selectZone(ZBY[zid],{open:true});return;}
  var w=b.getAttribute('data-who');if(w){filterReg(w);return;}
  if(b.id==='copyvis')copyVis(b);});
menu.addEventListener('change',function(e){var c=e.target;if(c&&c.matches&&c.matches('.todo input[type="checkbox"]'))saveTodo(c);});
mTabs.addEventListener('keydown',function(e){var tabs=$$('[role="tab"]',mTabs),i=tabs.indexOf(document.activeElement),j=-1;if(i<0)return;
  if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;
  e.preventDefault();setTab(tabs[j].getAttribute('data-tab'),true);});
mBody.addEventListener('pointerover',function(e){var el=e.target.closest('[data-tip]');if(el)showTip(el.getAttribute('data-tip'),e.clientX,e.clientY);});
mBody.addEventListener('pointermove',function(e){var el=e.target.closest('[data-tip]');if(el)showTip(el.getAttribute('data-tip'),e.clientX,e.clientY);});
mBody.addEventListener('pointerout',function(e){if(e.target.closest('[data-tip]'))tip.hidden=true;});
mBody.addEventListener('focusin',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el){var b=el.getBoundingClientRect();showTip(el.getAttribute('data-tip'),b.left+b.width/2,b.top);}});
mBody.addEventListener('focusout',function(){tip.hidden=true;});
mBody.addEventListener('scroll',function(){tip.hidden=true;},{passive:true});

/* ---------- оглавление ---------- */
var tocBack=null;
function buildToc(){
  var h='<div class="toc-in" role="dialog" aria-modal="true" aria-labelledby="toc-h"><div class="toc-head"><div><p class="kicker">Цивільна справа · Вінницький міський суд · суддя Бессараб Н. М.</p><h2 id="toc-h">Оглавление дела 127/20805/26</h2><p class="toc-sub">Провадження 2/127/5742/26 · истец — АТ «АКЦЕНТ-БАНК» · ответчик — вы. Банк требует <span class="n">184 532,63</span> грн. Сегодня 04.11.2026; заседание 05.10 не состоялось, следующее — 19.11.2026.</p></div><button type="button" class="m-x" id="toc-x" aria-label="Закрыть оглавление">×</button></div><div class="toc-grid">';
  h+=ZONES.map(function(z){return '<section class="toc-z" style="--zc:var('+z.tok+')"><button type="button" class="toc-zb" data-zone="'+z.id+'"><i></i><span>'+esc(z.name)+' <span class="zs">— '+esc(z.sub)+'</span></span><em>'+esc(z.dates||'')+'</em></button><ul>'+z.nodes.map(function(id){var n=byId[id];return '<li><button type="button" data-node="'+n.id+'"><i class="g" data-s="'+n.s+'"></i><span class="d">'+esc(n.date)+'</span><span>'+esc(n.title)+'</span></button></li>';}).join('')+'</ul></section>';}).join('');
  h+='</div><h3 class="sub">Обозначения</h3><ul class="legend">'+LEGEND.map(function(k){return '<li><i class="g" data-s="'+k+'"></i>'+esc(STATUS[k].t)+'</li>';}).join('')+'</ul>';
  h+='<div class="toc-foot"><p>Подготовлено ИИ-ассистентом по материалам репозитория FARTOFALOS/advokat на 04.11.2026. Практикующий адвокат материалы не проверял.</p><p>Страница для вас. В суд и банку её не направлять.</p></div></div>';
  toc.innerHTML=h;}
function openToc(){tocBack=document.activeElement;toc.hidden=false;btnToc.setAttribute('aria-expanded','true');var f=toc.querySelector('[data-zone]');try{(f||$('#toc-x')).focus();}catch(_){}}
function closeToc(back){toc.hidden=true;btnToc.setAttribute('aria-expanded','false');if(back!==false&&tocBack&&tocBack.focus)try{tocBack.focus();}catch(_){}}
btnToc.addEventListener('click',function(){if(toc.hidden)openToc();else closeToc();});
toc.addEventListener('click',function(e){if(e.target===toc){closeToc();return;}var b=e.target.closest('button');if(!b)return;if(b.id==='toc-x'){closeToc();return;}
  var id=b.getAttribute('data-node'),zid=b.getAttribute('data-zone');if(!id&&!zid)return;closeToc(false);
  if(id)selectNode(byId[id],{open:true,focus:true});else selectZone(ZBY[zid],{open:true,focus:true});});
toc.addEventListener('keydown',function(e){if(e.key!=='Tab')return;var f=$$('button,a[href]',toc).filter(function(x){return x.offsetParent!==null;});if(!f.length)return;var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}});
$$('.bar [data-node]').forEach(function(b){b.addEventListener('click',function(){var n=byId[b.getAttribute('data-node')];if(!toc.hidden)closeToc(false);selectNode(n,{open:true});});});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!toc.hidden){e.preventDefault();closeToc();return;}if(menuOpen){e.preventDefault();closeMenu();}});
window.addEventListener('hashchange',function(){route(true);});
function route(fly){var id='';try{id=decodeURIComponent(location.hash.replace(/^#/,''));}catch(_){id='';}
  if(byId[id])selectNode(byId[id],{open:true,hash:false,fly:fly!==false});else if(ZBY[id])selectZone(ZBY[id],{open:true,hash:false,fly:fly!==false});}

/* ---------- кадр и ввод ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!visible){lastTs=ts;return;}
  var dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  var anim=playing&&!reduce;
  if(anim){t+=dt;if(ts-lastInteract>4000&&!drag&&!tween&&!pinch)cam.yaw+=dt*.085;}
  if(tween){var k=Math.min(1,(ts-tween.t0)/tween.ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;Object.keys(tween.to).forEach(function(key){cam[key]=tween.from[key]+(tween.to[key]-tween.from[key])*e;});if(k>=1)tween=null;dirty=true;}
  if(Math.abs(tCX-CX)>.3||Math.abs(tCY-CY)>.3){var kk=reduce?1:Math.min(1,dt*7);CX+=(tCX-CX)*kk;CY+=(tCY-CY)*kk;dirty=true;}
  if(!anim&&!dirty)return;
  dirty=false;draw();
}
function pickNode(mx,my){var best=null,bd=1e9;NODES.forEach(function(n){if(!n.p)return;var dx=mx-n.p.x,dy=my-n.p.y,hr=Math.max((n.r||8)+6,16);if(dx*dx+dy*dy<=hr*hr&&n.p.d<bd){bd=n.p.d;best=n;}});return best;}
function segDist(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,k=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0,x=ax+dx*k-px,y=ay+dy*k-py;return Math.sqrt(x*x+y*y);}
function pickZone(mx,my){var best=null,bd=1e9;ZONES.forEach(function(z){if(!z.pp||!z.wpx)return;var th=Math.max(9,z.wpx/2+2);for(var i=0;i<z.pp.length-1;i++){var a=z.pp[i],b=z.pp[i+1];if(!a||!b)continue;var d=segDist(mx,my,a.x,a.y,b.x,b.y);if(d<th&&d<bd){bd=d;best=z;}}});return best;}
function hitAt(x,y){var n=pickNode(x,y);if(n)return {kind:'node',id:n.id};var z=pickZone(x,y);return z?{kind:'zone',id:z.id}:null;}
function initTree(){
  buildLabels();buildToc();
  if(!ctx){$('#nogl').hidden=false;$('#stage-ui').hidden=true;$('#hint').hidden=true;selectNode(byId.now,{fly:false,open:true,hash:false});inited=true;route(false);return;}
  readTheme();resize();
  cam.yaw=byId.now.cy[0]-Math.PI/2+.3;
  selectNode(byId.now,{fly:false,open:!mobile,hash:false});
  cam.dist=fitAll();setPressed('all');
  updateCenter(true);inited=true;route(true);
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
  if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',readTheme);else if(mq.addListener)mq.addListener(readTheme);}
  new MutationObserver(readTheme).observe(docEl,{attributes:true,attributeFilter:['data-theme','class']});
  document.addEventListener('visibilitychange',function(){visible=!document.hidden;dirty=true;});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measureLabels();dirty=true;});
  cv.addEventListener('pointerdown',function(e){try{cv.focus({preventScroll:true});}catch(_){}ptrs[e.pointerId]={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}
    var ids=Object.keys(ptrs);if(ids.length>=2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d0:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),dist0:cam.dist};drag=null;tween=null;return;}
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch,moved:false};lastInteract=performance.now();});
  cv.addEventListener('pointermove',function(e){if(ptrs[e.pointerId]){ptrs[e.pointerId].x=e.clientX;ptrs[e.pointerId].y=e.clientY;}
    if(pinch){var ids=Object.keys(ptrs);if(ids.length>=2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));cam.dist=clamp(pinch.dist0*pinch.d0/d,9,95);lastInteract=performance.now();dirty=true;}return;}
    if(drag&&drag.id===e.pointerId){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;tween=null;cv.classList.add('drag');}
      if(drag.moved){cam.yaw=drag.yaw-dx*.006;cam.pitch=clamp(drag.pitch+dy*.004,-.3,1.2);lastInteract=performance.now();dirty=true;}return;}
    if(e.pointerType==='mouse'){var r=cv.getBoundingClientRect(),h=hitAt(e.clientX-r.left,e.clientY-r.top),k1=h?h.kind+h.id:'',k2=hover?hover.kind+hover.id:'';if(k1!==k2){hover=h;dirty=true;}cv.classList.toggle('hot',!!h);}});
  function endPtr(e){delete ptrs[e.pointerId];try{cv.releasePointerCapture(e.pointerId);}catch(_){}
    if(pinch){if(Object.keys(ptrs).length<2)pinch=null;drag=null;cv.classList.remove('drag');return;}
    if(!drag||drag.id!==e.pointerId)return;
    if(!drag.moved&&e.type==='pointerup'){var r=cv.getBoundingClientRect(),h=hitAt(e.clientX-r.left,e.clientY-r.top);if(h){if(h.kind==='node')selectNode(byId[h.id],{open:true});else selectZone(ZBY[h.id],{open:true});}}
    cv.classList.remove('drag');drag=null;lastInteract=performance.now();}
  cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
  cv.addEventListener('pointerleave',function(){if(!drag&&!pinch&&hover){hover=null;cv.classList.remove('hot');dirty=true;}});
  stage.addEventListener('wheel',function(e){if(e.target.closest('.menu,.toc,.stage-ui'))return;e.preventDefault();tween=null;cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.0012),9,95);lastInteract=performance.now();dirty=true;},{passive:false});
  cv.addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowLeft'){tween=null;cam.yaw-=.12;}else if(k==='ArrowRight'){tween=null;cam.yaw+=.12;}else if(k==='ArrowUp'){tween=null;cam.pitch=clamp(cam.pitch-.08,-.3,1.2);}else if(k==='ArrowDown'){tween=null;cam.pitch=clamp(cam.pitch+.08,-.3,1.2);}
    else if(k==='+'||k==='=')zoom(.85);else if(k==='-'||k==='_')zoom(1.18);else if(k==='Enter'){setMenu(true);focusTitle();}else return;e.preventDefault();lastInteract=performance.now();dirty=true;});
  $$('#stage-ui [data-view]').forEach(function(b){b.addEventListener('click',function(){view(b.getAttribute('data-view'));});});
  $('#zin').addEventListener('click',function(){zoom(.8);});
  $('#zout').addEventListener('click',function(){zoom(1.25);});
  var pb=$('#play');function syncPlay(){pb.textContent=playing?'Пауза':'Пуск';pb.setAttribute('aria-pressed',String(!playing));}
  syncPlay();pb.addEventListener('click',function(){playing=!playing;if(reduce)playing=false;syncPlay();dirty=true;});
  requestAnimationFrame(frame);
}
initTree();
})();
</script>
